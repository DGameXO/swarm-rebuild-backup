name: Release

# The only thing that writes a version: package.json, CHANGELOG.md, the tag
# and the GitHub release all come from release-please. It runs on the default
# GITHUB_TOKEN, exactly like the manual release this replaces.
#
# Publishing lives in this file on purpose. npm validates the *calling*
# workflow name when `workflow_call` is involved, so keeping `npm publish`
# here (no reusable workflow) leaves no room for a mismatch with the trusted
# publisher configured on npmjs.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  source:
    name: release from main
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test -n "$TAG" || { echo "::error::No tag was released"; exit 1; }
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" HEAD || {
            echo "::error::Tag $TAG is not an ancestor of main"; exit 1; }

  build:
    name: build
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      node-version: "26"

  test:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: swarm-rebuild
      - run: npm install --no-save --ignore-scripts swarm-rebuild-*.tgz
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: publish
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/swarm-rebuild
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # Trusted publishing exchanges the OIDC token itself: any
      # NODE_AUTH_TOKEN in the environment would bypass it.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: swarm-rebuild
      - name: Tag and package.json agree
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$TAG" || {
            echo "::error::package.json says $version but the release tag is $TAG"; exit 1; }
      - name: Publish the tested tarball
        run: npm publish swarm-rebuild-*.tgz --access public --provenance
      - name: Summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BODY: ${{ needs.release-please.outputs.body }}
          URL: https://www.npmjs.com/package/swarm-rebuild/v/${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "### Published \`swarm-rebuild@${TAG#v}\`"
            echo
            echo "$URL"
            echo
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"
