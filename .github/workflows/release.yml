name: Release

# Publishes the tag release-please created. Never tags, bumps a version or
# edits the GitHub release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, e.g. `v0.3.0`.
        type: string
        required: true
      body:
        description: Release notes, shown in the job summary.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  source:
    name: release from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$TAG" || { echo "::error::No tag passed to the Release workflow"; exit 1; }
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" HEAD || {
            echo "::error::Tag $TAG is not an ancestor of main"; exit 1; }

  build:
    name: build
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      node-version: "26"

  test:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: swarm-rebuild
      - run: npm install --no-save --ignore-scripts swarm-rebuild-*.tgz
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: publish
    needs: [source, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/swarm-rebuild
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Trusted publishing exchanges the OIDC token itself: any
      # NODE_AUTH_TOKEN in the environment would bypass it.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: swarm-rebuild
      - name: Tag and package.json agree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$TAG" || {
            echo "::error::package.json says $version but the release tag is $TAG"; exit 1; }
      - name: Publish the tested tarball
        run: npm publish swarm-rebuild-*.tgz --access public --provenance
      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          BODY: ${{ inputs.body }}
          URL: https://www.npmjs.com/package/swarm-rebuild/v/${{ inputs.tag }}
        run: |
          {
            echo "### Published \`swarm-rebuild@${TAG#v}\`"
            echo
            echo "$URL"
            echo
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"
