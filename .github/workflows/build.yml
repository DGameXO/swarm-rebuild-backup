name: Build

# Reusable workflow. Publishes the exact `dist/` and tarball that e2e tests
# and, on a release, npm publishes: what is tested is what ships.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to build with.
        type: string
        default: "26"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run api-report:check
      - run: npm pack
      - name: No source maps in the tarball
        run: |
          if tar -tzf swarm-rebuild-*.tgz | grep -qE '\.map$'; then
            echo "::error::source maps must not be published"
            exit 1
          fi
      - name: No runtime dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          test "$count" -eq 0 || { echo "::error::swarm-rebuild must not gain a runtime dependency (found $count)"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: swarm-rebuild
          path: |
            dist
            swarm-rebuild-*.tgz
          retention-days: 7
          if-no-files-found: error
