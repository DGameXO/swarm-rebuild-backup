<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="swarm-rebuild">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.5" stop-color="#a259ff"/>
      <stop offset="1" stop-color="#1abcfe"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1010" cy="70" r="150" fill="#a259ff" opacity="0.13" filter="url(#glow)"/>
  <circle cx="180" cy="300" r="140" fill="#5b8cff" opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(72 96)">
    <text x="0" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="-2.4" fill="#ffffff">swarm</text>
    <text x="182" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="-2.4" fill="url(#accent)">-rebuild</text>
    <text x="2" y="86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#9aa3b8">Wipe a page to a blank canvas. Watch a swarm of cursors build it back.</text>
    <g transform="translate(2 112)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#ffffff" fill-opacity="0.06"/>
      <text x="14" y="17" fill="#c9d1e6">TypeScript</text>
      <rect x="130" y="0" width="132" height="26" rx="13" fill="#ffffff" fill-opacity="0.06"/>
      <text x="144" y="17" fill="#c9d1e6">0 dependencies</text>
      <rect x="272" y="0" width="112" height="26" rx="13" fill="#ffffff" fill-opacity="0.06"/>
      <text x="286" y="17" fill="#c9d1e6">shadow DOM</text>
    </g>
  </g>

